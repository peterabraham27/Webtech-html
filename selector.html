<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* simple selector id(#)target a single element */
        #heading{
            color: brown;
            background-color: aqua;
        }
         /* simple selector class(.)target multiple element */
         .head{
            color: blue;
            background-color: azure;
         }
         /* simple selector tag(tag name)target element according to tag name */
         h4{
            color: rgb(194, 120, 9);
            background-color: blueviolet;
        }
        /* simple selector grouping(,)target multiple element */
        h5,h6{
            color: rgb(202, 54, 0);
            background-color: beige;
        }
        /* universal selector(*) used target the whole elements in the document */
        /* *{
            color: chartreuse;
        } */
    </style>
</head>
<body>
    <h1 id="heading">Peter Abraham</h1>
    <h2 class="head">Peter Abraham</h2>
    <h3 class="head">Peter Abraham</h3>
    <h4>Peter Abraham</h4>
    <h5>Peter Abraham</h5>
    <h6>Peter Abraham</h6>
</body>
</html>
